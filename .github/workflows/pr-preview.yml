name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build-preview:
    name: Build Preview (${{ matrix.app }})
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    strategy:
      matrix:
        app: [front-screen, back-screen, dmd-screen]
    environment: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm --filter @frontend/${{ matrix.app }} run build
        env:
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VITE_SCREEN_HUB_URL: ${{ secrets.VITE_SCREEN_HUB_URL }}
          VITE_SCREEN_TOKEN: ${{ secrets.VITE_SCREEN_TOKEN }}

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist/
          retention-days: 1

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [build-preview]
    if: github.event.action != 'closed'
    steps:
      - name: Download front-screen preview
        uses: actions/download-artifact@v4
        with:
          name: preview-front-screen
          path: preview-output/front-screen

      - name: Download back-screen preview
        uses: actions/download-artifact@v4
        with:
          name: preview-back-screen
          path: preview-output/back-screen

      - name: Download dmd-screen preview
        uses: actions/download-artifact@v4
        with:
          name: preview-dmd-screen
          path: preview-output/dmd-screen

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./preview-output
          destination_dir: preview/pr-${{ github.event.number }}
          keep_files: true
          enable_jekyll: false

      - name: Post PR comment with preview URLs
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseUrl = `https://${owner}.github.io/${repo}/preview/pr-${prNumber}`;

            const body = [
              '<!-- pr-preview -->',
              '## Preview Deployments',
              '',
              '| App | URL |',
              '|-----|-----|',
              `| front-screen | [${baseUrl}/front-screen](${baseUrl}/front-screen) |`,
              `| back-screen | [${baseUrl}/back-screen](${baseUrl}/back-screen) |`,
              `| dmd-screen | [${baseUrl}/dmd-screen](${baseUrl}/dmd-screen) |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes('<!-- pr-preview -->'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup-preview:
    name: Cleanup Preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Remove preview directory and push
        run: |
          if [ -d "preview/pr-${{ github.event.number }}" ]; then
            git rm -rf "preview/pr-${{ github.event.number }}"
            git commit -m "chore: remove preview for PR #${{ github.event.number }}"
            git push
          fi
