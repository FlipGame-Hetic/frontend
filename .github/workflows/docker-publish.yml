name: Publish Docker image

on:
  push:
    branches: [main, dev]
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app: [front-screen, back-screen, dmd-screen]

    environment: ${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/flipgame-hetic/${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_WS_URL=${{ secrets.VITE_WS_URL }}
            VITE_SCREEN_HUB_URL=${{ secrets.VITE_SCREEN_HUB_URL }}
            VITE_SCREEN_TOKEN=${{ secrets.VITE_SCREEN_TOKEN }}
          cache-from: type=registry,ref=ghcr.io/flipgame-hetic/${{ matrix.app }}:buildcache
          cache-to: type=registry,ref=ghcr.io/flipgame-hetic/${{ matrix.app }}:buildcache,mode=max
